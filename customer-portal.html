
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriMarket | Customer Portal</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f3;color:#183b29}
header{background:#075b32;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h2{margin:0}
nav{display:flex;gap:7px;flex-wrap:wrap}
button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:bold}
nav button{background:white;color:#075b32}
.container{max-width:1100px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001;margin-bottom:18px}
input{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #cbd8ce;border-radius:7px}
.primary{background:#08783e;color:white}
.secondary{background:#e5eee7;color:#17432b}
.danger{background:#c62828;color:white}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0001}
.product img{width:100%;height:165px;object-fit:cover;background:#e5eee7}
.product-info{padding:14px}
.product h3{margin:5px 0}
.price{font-size:19px;font-weight:bold;color:#08783e}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:#e2f5e8;color:#08783e;padding:5px 9px;border-radius:20px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#183b29;color:white;padding:12px 20px;border-radius:8px;display:none;z-index:10}
footer{text-align:center;padding:20px;color:#617568}
@media(max-width:600px){header{align-items:flex-start}nav{width:100%}nav button{flex:1}}
</style>
</head>

<body>

<header>
<h2>🌾 AgriMarket</h2>
<nav id="mainNav" class="hidden">
<button onclick="showPage('shop')">Shop</button>
<button onclick="showPage('cart')">Cart 🛒 <span id="cartCount">0</span></button>
<button onclick="showPage('orders')">My Orders</button>
<button onclick="showPage('profile')">Profile</button>
<button onclick="logout()">Logout</button>
</nav>
</header>

<div class="container">

<section id="loginPage" class="card">
<h2>Customer Login</h2>
<p>Login to purchase fresh products directly from farmers.</p>

<label>Username</label>
<input id="loginUser" placeholder="Enter your username">

<label>Password</label>
<input id="loginPass" type="password" placeholder="Enter your password">

<button class="primary" onclick="login()">Login</button>
<button class="secondary" onclick="showAuth('register')">Create New Account</button>
</section>

<section id="registerPage" class="card hidden">
<h2>Create Customer Account</h2>

<label>Full Name</label>
<input id="regName" placeholder="Enter your name">

<label>Username</label>
<input id="regUser" placeholder="Create username">

<label>Password</label>
<input id="regPass" type="password" placeholder="Create password">

<label>Mobile Number</label>
<input id="regMobile" type="tel" placeholder="Mobile number">

<label>Address</label>
<input id="regAddress" placeholder="Delivery address">

<button class="primary" onclick="register()">Register</button>
<button class="secondary" onclick="showAuth('login')">Back to Login</button>
</section>

<section id="shopPage" class="hidden">
<div class="card">
<h2>Fresh Products</h2>
<p>Buy directly from farmers.</p>
<input id="searchBox" placeholder="Search products..." oninput="renderProducts()">
</div>
<div id="productList" class="grid"></div>
</section>

<section id="cartPage" class="hidden">
<div class="card">
<h2>My Shopping Cart</h2>
<div id="cartItems"></div>
<h3 id="cartTotal">Total: ₹0</h3>
<button class="primary" onclick="placeOrder()">Place Order</button>
</div>
</section>

<section id="ordersPage" class="hidden">
<div class="card">
<h2>My Orders</h2>
<div id="orderList"></div>
</div>
</section>

<section id="profilePage" class="hidden">
<div class="card">
<h2>My Profile</h2>
<div id="profileInfo"></div>
</div>
</section>

</div>

<footer>© 2026 AgriMarket | Smart Agri Connect</footer>
<div id="toast" class="toast"></div>

<script>
// Demo login details are not displayed on the login screen.
// NOTE: Client-side demo credentials are visible to anyone inspecting this source.
const demoCustomers={
 customer1:{name:"Customer Demo",password:"1234",mobile:"",address:""}
};

let currentUser="";

function getCustomers(){
return JSON.parse(localStorage.getItem("agri_customers")||"{}");
}
function saveCustomers(data){
localStorage.setItem("agri_customers",JSON.stringify(data));
}
function showToast(msg){
let t=document.getElementById("toast");
t.textContent=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2500);
}
function showAuth(page){
document.getElementById("loginPage").classList.toggle("hidden",page!=="login");
document.getElementById("registerPage").classList.toggle("hidden",page!=="register");
}
function showPage(page){
["shop","cart","orders","profile"].forEach(p=>document.getElementById(p+"Page").classList.add("hidden"));
document.getElementById(page+"Page").classList.remove("hidden");
if(page==="shop")renderProducts();
if(page==="cart")renderCart();
if(page==="orders")renderOrders();
if(page==="profile")renderProfile();
}
function register(){
let name=document.getElementById("regName").value.trim();
let username=document.getElementById("regUser").value.trim().toLowerCase();
let password=document.getElementById("regPass").value;
let mobile=document.getElementById("regMobile").value.trim();
let address=document.getElementById("regAddress").value.trim();

if(!name||!username||!password){
showToast("Please fill required fields");return;
}
if(username.length<3||password.length<4){
showToast("Username must be 3+ and password 4+ characters");return;
}
let customers=getCustomers();
if(customers[username]||demoCustomers[username]){
showToast("Username already exists");return;
}
customers[username]={name,password,mobile,address};
saveCustomers(customers);
showToast("Account created. Please login.");
showAuth("login");
document.getElementById("loginUser").value=username;
document.getElementById("loginPass").value="";
}
function login(){
let username=document.getElementById("loginUser").value.trim().toLowerCase();
let password=document.getElementById("loginPass").value;
let account=getCustomers()[username]||demoCustomers[username];

if(!account||account.password!==password){
showToast("Invalid username or password");return;
}
currentUser=username;
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("registerPage").classList.add("hidden");
document.getElementById("mainNav").classList.remove("hidden");
showPage("shop");
showToast("Welcome "+account.name);
}
function logout(){
currentUser="";
document.getElementById("mainNav").classList.add("hidden");
["shop","cart","orders","profile"].forEach(p=>document.getElementById(p+"Page").classList.add("hidden"));
document.getElementById("loginPage").classList.remove("hidden");
document.getElementById("loginPass").value="";
document.getElementById("loginUser").value="";
showToast("Logged out");
}
function escapeHTML(value){
return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function getAllProducts(){
let products=[];
for(let i=1;i<=5;i++){
let farmerId="farmer"+i;
let data=JSON.parse(localStorage.getItem("products_"+farmerId)||"[]");
data.forEach((p,index)=>products.push({...p,farmerId,productId:farmerId+"_"+index,farmerName:"Farmer "+i}));
}
return products;
}
function renderProducts(){
let list=document.getElementById("productList");
let search=(document.getElementById("searchBox").value||"").toLowerCase();
let products=getAllProducts().filter(p=>(p.name||"").toLowerCase().includes(search));
if(!products.length){
list.innerHTML='<div class="card">No products found. Farmers have not added products yet.</div>';return;
}
list.innerHTML=products.map(p=>`
<div class="product">
<img src="${escapeHTML(p.image||"")}" alt="Product" onerror="this.src='https://placehold.co/400x250?text=Farm+Product'">
<div class="product-info">
<h3>${escapeHTML(p.name||"Product")}</h3>
<p class="price">₹${Number(p.price)||0}</p>
<p>👨‍🌾 ${escapeHTML(p.farmerName)}</p>
<button class="primary" onclick="addToCart('${p.productId}')">Add to Cart</button>
</div></div>`).join("");
}
function getCart(){
return JSON.parse(localStorage.getItem("cart_"+currentUser)||"[]");
}
function saveCart(cart){
localStorage.setItem("cart_"+currentUser,JSON.stringify(cart));
updateCartCount();
}
function addToCart(id){
let p=getAllProducts().find(x=>x.productId===id);
if(!p)return;
let cart=getCart();
let existing=cart.find(x=>x.productId===id);
if(existing)existing.quantity++;
else cart.push({productId:p.productId,name:p.name,price:Number(p.price)||0,farmerId:p.farmerId,quantity:1});
saveCart(cart);
showToast("Product added to cart");
}
function updateCartCount(){
document.getElementById("cartCount").textContent=getCart().reduce((sum,p)=>sum+p.quantity,0);
}
function changeQty(index,amount){
let cart=getCart();
if(!cart[index])return;
cart[index].quantity+=amount;
if(cart[index].quantity<=0)cart.splice(index,1);
saveCart(cart);
renderCart();
}
function removeCartItem(index){
let cart=getCart();
cart.splice(index,1);
saveCart(cart);
renderCart();
}
function renderCart(){
let cart=getCart(),box=document.getElementById("cartItems");
if(!cart.length){
box.innerHTML="<p>Your cart is empty.</p>";
document.getElementById("cartTotal").textContent="Total: ₹0";return;
}
let total=0;
box.innerHTML=cart.map((p,i)=>{
let subtotal=p.price*p.quantity;total+=subtotal;
return `<div class="card"><div class="row"><div><h3>${escapeHTML(p.name)}</h3><p>₹${p.price} × ${p.quantity} = ₹${subtotal}</p></div><div>
<button class="secondary" onclick="changeQty(${i},-1)">−</button>
<button class="secondary" onclick="changeQty(${i},1)">+</button>
<button class="danger" onclick="removeCartItem(${i})">Remove</button>
</div></div></div>`;
}).join("");
document.getElementById("cartTotal").textContent="Total: ₹"+total;
}
function placeOrder(){
let cart=getCart();
if(!cart.length){showToast("Your cart is empty");return;}
let customer=getCustomers()[currentUser]||demoCustomers[currentUser];
if(!customer.address){
showToast("Please add delivery address in Profile");
showPage("profile");return;
}
let orders=JSON.parse(localStorage.getItem("orders_"+currentUser)||"[]");
orders.unshift({
id:"ORD"+Date.now(),items:cart,
total:cart.reduce((sum,p)=>sum+p.price*p.quantity,0),
date:new Date().toLocaleString(),
status:"Order Placed",address:customer.address
});
localStorage.setItem("orders_"+currentUser,JSON.stringify(orders));
saveCart([]);
renderCart();
showToast("Order placed successfully");
}
function renderOrders(){
let orders=JSON.parse(localStorage.getItem("orders_"+currentUser)||"[]");
let box=document.getElementById("orderList");
if(!orders.length){box.innerHTML="<p>No orders yet.</p>";return;}
box.innerHTML=orders.map(o=>`
<div class="card"><h3>${escapeHTML(o.id)}</h3>
<p>Date: ${escapeHTML(o.date)}</p>
<p>Status: <span class="badge">${escapeHTML(o.status)}</span></p>
<p>Total: ₹${o.total}</p>
<p>Address: ${escapeHTML(o.address)}</p>
<h4>Products</h4>
${o.items.map(p=>`<p>${escapeHTML(p.name)} × ${p.quantity}</p>`).join("")}
</div>`).join("");
}
function renderProfile(){
let customer=getCustomers()[currentUser]||demoCustomers[currentUser];
if(!customer)return;
document.getElementById("profileInfo").innerHTML=`
<label>Full Name</label><input id="profileName" value="${escapeHTML(customer.name)}">
<label>Mobile Number</label><input id="profileMobile" value="${escapeHTML(customer.mobile||"")}">
<label>Delivery Address</label><input id="profileAddress" value="${escapeHTML(customer.address||"")}">
<button class="primary" onclick="saveProfile()">Save Profile</button>`;
}
function saveProfile(){
let customers=getCustomers();
let customer=customers[currentUser]||demoCustomers[currentUser];
if(!customer)return;
customer.name=document.getElementById("profileName").value.trim();
customer.mobile=document.getElementById("profileMobile").value.trim();
customer.address=document.getElementById("profileAddress").value.trim();
if(customers[currentUser])saveCustomers(customers);
showToast("Profile updated");
}
</script>
</body>
</html>
